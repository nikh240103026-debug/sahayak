# Hourly cleanup of expired documents and screenshots.
# Vercel's free plan only runs crons daily; this keeps retention close to RETENTION_HOURS.
# Needs repository secrets: SITE_URL (no trailing slash) and CRON_SECRET (same as in Vercel).
name: retention

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the retention route
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET is not set; skipping."
            exit 0
          fi
          code=$(curl -sS -o out.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/retention")
          echo "HTTP $code"; cat out.json
          [ "$code" = "200" ]
