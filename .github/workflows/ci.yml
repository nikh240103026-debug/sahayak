name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Build-time placeholders only. No real secrets are needed for checks and the agent e2e.
  NEXT_PUBLIC_SITE_URL: http://localhost:3100
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-secret

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund
      - run: npx playwright install --with-deps chromium
      # The agent drives Chromium through the in-memory demo portal; model responses are replayed fixtures.
      - run: npx playwright test -c e2e/playwright.config.ts --project=agent --project=a11y
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  full-stack:
    # Sign-up to receipt against a local Supabase stack and a real worker process.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: checks
    env:
      E2E_FULL_STACK: "1"
      DEMO_PORTAL_BASE_URL: http://localhost:3100
      LLM_FIXTURES: replay
      LLM_DISABLED: "false"
      RETENTION_HOURS: "24"
      MAX_RUNS_PER_USER_PER_DAY: "20"
      GRIEVANCE_EMAIL: grievance@example.com
      SUPPORT_EMAIL: support@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start Supabase (applies migrations and seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Export Supabase and test secrets
        run: |
          supabase status -o env > /tmp/sb.env
          . /tmp/sb.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "WORKER_SHARED_SECRET=$(openssl rand -hex 32)"
            echo "CRON_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - name: Start worker
        run: |
          npm run build -w @app/worker
          (cd apps/worker && LLM_FIXTURES_DIR=../../fixtures/llm PORT=8080 node dist/server.js > ../../worker.log 2>&1 &)
          echo "WORKER_URL=http://localhost:8080" >> "$GITHUB_ENV"
      - run: npx playwright test -c e2e/playwright.config.ts --project=app
      - if: always()
        run: tail -n 200 worker.log || true
